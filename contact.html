<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Start planning a considered journey with Xplore.">
  <title>Contact — Xplore</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body id="top">
  <site-header></site-header>
  <main class="page-main">
    <section class="section section--tight">
      <div class="contact-layout shell">
        <div class="contact-copy reveal"><span class="eyebrow">Start with a conversation</span><h1>Let's plan<br><em>your journey.</em></h1><p>Share the place, season or feeling on your mind. We will return with a focused starting point.</p><div class="contact-list"><div class="contact-list__item"><span>Phone</span><a href="tel:+1234567890">+123 456 7890</a></div><div class="contact-list__item"><span>Email</span><a href="mailto:hello@xplore.example">hello@xplore.example</a></div><div class="contact-list__item"><span>Address</span><p>123 Wanderer Street<br>Any State, Earth</p></div></div></div>
        <form class="contact-form reveal" data-demo-form novalidate><h2>Tell us what you are imagining.</h2><div class="field"><label for="name">Name *</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="interest">Journey interest</label><select id="interest" name="interest"><option value="">Choose one</option><option>Bali</option><option>Morocco</option><option>Nepal</option><option>Kenya</option><option>Something else</option></select></div><div class="field"><label for="message">Message *</label><textarea id="message" name="message" required minlength="10" placeholder="Where would you like to go, and what matters to you?"></textarea></div><button class="pill" type="submit">Validate enquiry ↗</button><p class="form-status" data-form-status aria-live="polite"></p></form>
      </div>
    </section>
    <section class="contact-map"><img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=2200&q=78" alt="Aerial map-like view of a city" loading="lazy"><span class="contact-map__pin" aria-hidden="true">⌖</span></section>
  </main>
  <site-footer></site-footer>
  <script type="module" src="js/components.js"></script><script type="module" src="js/main.js"></script>
</body>
</html>
